# PR gate. Everything the plan says a phase "must end green" on, enforced
# automatically instead of depending on someone remembering to run it.
#
# Deliberately NOT here:
#   - contract suites (need the real agent-browser/aft/imgup binaries, and a
#     browser needs Xvfb + Chrome — they belong on a machine with those, run via
#     `bun run test:contract*`)
#   - the model eval (needs OPENCODE_API_KEY and makes hundreds of live calls)
#   - deploy (Phase 7 owns that, with Alchemy)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: the check job commits the refreshed README badge/graph back to main.
  contents: write

jobs:
  check:
    name: lint · typecheck · test · health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          # fallow audit diffs against the merge-base, so it needs history —
          # a shallow clone leaves it with nothing to compare.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # --reporter=json feeds the HTML report below; the default reporter still
      # prints to the log so a failure is readable without downloading anything.
      # --coverage writes Istanbul data that the audit job consumes for accurate
      # CRAP scoring (without it every function scores as 0% covered).
      - name: Test
        run: bun run test --coverage --reporter=default --reporter=json --outputFile=reports/.vitest.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/coverage-final.json
          retention-days: 3

      # Per-package floors from health-baseline.json. A new package with no
      # recorded floor must score >= 90.
      - name: Health
        run: bun run health

      # Static half of the secret contract: every string config field the Env
      # interface reads must be explained in secrets.json. Deployed secrets are
      # not visible here (no wrangler auth), and the script knows that — it
      # gates on the manifest/Env mismatch only.
      - name: Secret contract
        run: bun run secrets

      # The gates above print to a log that scrolls away. This renders the same
      # data twice: a markdown digest straight onto the run page (no download),
      # and the full HTML page as an artifact for the SVG trends.
      #
      # always(): the report is most useful when something FAILED.
      # --no-tests reuses the JSON from the test step instead of re-running.
      # --markdown puts the digest on stdout and progress on stderr, so the
      # redirect captures only the summary.
      # --assets (which rewrites the tracked README badge/graph/history) is added
      # ONLY on main. On a PR it would rewrite three tracked files that main also
      # rewrites, so every PR would arrive conflicting in exactly those files.
      - name: Quality report
        if: always()
        run: |
          assets=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            assets="--assets"
          fi
          node scripts/report.mjs --no-tests --markdown $assets >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: reports/
          retention-days: 30

      # The README badge, trend graph, and table are only live if the committed
      # files move. Push-to-main only: on a PR the base branch isn't ours to
      # write, and the numbers aren't final until it merges.
      #
      # The skip marker below is load-bearing — without it this commit triggers
      # the workflow that made it, forever.
      #
      # CAUTION: GitHub matches that marker ANYWHERE in a commit message, body
      # included. Mentioning it in prose silently skips the run — which is
      # exactly how the commit that added this step ended up never being tested.
      # Never write the literal token in a message you want CI to run.
      - name: Commit report assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/health.svg reports/badge.json reports/history.json README.md
          # --quiet exits 0 when nothing changed, so an unchanged score is not a
          # failed build and not an empty commit.
          if git diff --cached --quiet; then
            echo "report assets unchanged"
          else
            git commit -m "chore(report): refresh quality assets [skip ci]"
            # A push landing during this run would reject a plain push; rebasing
            # onto it keeps the newer work and re-applies only these assets.
            git pull --rebase --autostash origin main
            git push
          fi

  audit:
    name: fallow audit (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR-only: it scopes to the diff against the merge-base, which is
    # meaningless on a push to main.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # CRAP = cyclomatic² × (1−coverage)³ + cyclomatic. Without coverage data
      # fallow assumes 0%, so a cyc=5 function scores 30 and trips the default
      # threshold purely for looking untested. Generated here rather than pulled
      # from the check job's artifact so this job stays independently runnable.
      - name: Coverage
        run: bun run test --coverage --silent

      # Gates on findings the changeset INTRODUCED, not inherited debt — so a
      # PR touching worker/ isn't blocked by the circular deps Phase 5 exists
      # to fix.
      - name: Audit
        run: bun run audit --coverage coverage/coverage-final.json
        env:
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha }}
