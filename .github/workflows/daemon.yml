name: daemon

on:
  push:
    branches: [main]
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  pull_request:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]

defaults:
  run:
    working-directory: daemon

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow audit compares against the merge base.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: daemon/package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
