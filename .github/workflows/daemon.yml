name: daemon

on:
  push:
    branches: [main]
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  pull_request:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]

defaults:
  run:
    working-directory: daemon

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        run: rustup show active-toolchain || rustup toolchain install nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Install gate tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - name: rustdoc
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install declared MSRV
        run: |
          msrv=$(grep -m1 'rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          rustup toolchain install "$msrv" --profile minimal
          rustup override set "$msrv"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - run: cargo check --workspace --all-features --locked
