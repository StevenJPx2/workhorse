name: daemon

on:
  push:
    branches: [main]
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  pull_request:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]

defaults:
  run:
    working-directory: daemon

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow audit compares against the merge base.
          fetch-depth: 0
      # Installs Node from .node-version, Bun from packageManager, and Vite+ from package.json.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: daemon
          # Relative to working-directory.
          node-version-file: .node-version
          run-install: false
      # The conformance suite runs the daemon inside bubblewrap. Ubuntu restricts unprivileged user
      # namespaces through AppArmor; this runner is thrown away after the job, so the restriction
      # is lifted here rather than the suite running unsandboxed.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Lightness budgets on the runner, sandbox included (budgets/limits.ts). Runners differ in
      # transparent huge pages; "always" adds about 12 MB of huge pages to the idle daemon, so the
      # job measures the common default, "madvise". The report still shows AnonHugePages.
      - name: Budgets
        run: |
          echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          bun budgets/measure.ts
