name: daemon

on:
  push:
    branches: [main]
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  pull_request:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]

defaults:
  run:
    working-directory: daemon

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow audit compares against the merge base.
          fetch-depth: 0
      # Installs Node from .node-version, Bun from packageManager, and Vite+ from package.json.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: daemon
          node-version-file: daemon/.node-version
          run-install: false
      - run: bun install --frozen-lockfile
      - run: bun run check
