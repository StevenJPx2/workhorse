# The rules are pure: the shell owns storage, the clock, sockets, and threads.
# Only the private `glue` module may touch JavaScript types.
disallowed-methods = [
  { path = "std::fs::read", reason = "the core has no I/O" },
  { path = "std::fs::read_to_string", reason = "the core has no I/O" },
  { path = "std::fs::read_dir", reason = "the core has no I/O" },
  { path = "std::fs::write", reason = "the core has no I/O" },
  { path = "std::fs::copy", reason = "the core has no I/O" },
  { path = "std::fs::rename", reason = "the core has no I/O" },
  { path = "std::fs::remove_file", reason = "the core has no I/O" },
  { path = "std::fs::remove_dir_all", reason = "the core has no I/O" },
  { path = "std::fs::create_dir_all", reason = "the core has no I/O" },
  { path = "std::fs::metadata", reason = "the core has no I/O" },
  { path = "std::time::SystemTime::now", reason = "time is an input (now_ms)" },
  { path = "std::time::Instant::now", reason = "time is an input (now_ms)" },
  { path = "std::thread::spawn", reason = "the core is single-threaded" },
  { path = "std::process::exit", reason = "the core has no process control" },
  { path = "std::process::abort", reason = "the core has no process control" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "the core has no I/O" },
  { path = "std::fs::OpenOptions", reason = "the core has no I/O" },
  { path = "std::net::TcpStream", reason = "the core has no I/O" },
  { path = "std::net::TcpListener", reason = "the core has no I/O" },
  { path = "std::net::UdpSocket", reason = "the core has no I/O" },
  { path = "std::process::Command", reason = "the core has no process control" },
  { path = "std::thread::Builder", reason = "the core is single-threaded" },
  { path = "wasm_bindgen::JsValue", reason = "JavaScript types stay in the glue module" },
  { path = "wasm_bindgen::JsError", reason = "JavaScript types stay in the glue module" },
]
