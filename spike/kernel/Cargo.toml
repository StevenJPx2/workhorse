[workspace]
members = ["kernel", "kernel-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
# `deny`, not `forbid`: the glue crate's wasm exports need `#[unsafe(no_mangle)]`,
# allowed per export with a reason. The kernel crate forbids unsafe code in source.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
as_conversions = "deny"
too_many_lines = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
